trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  pythonVersion: '3.12'

stages:

# =========================
# BUILD
# =========================
- stage: Build
  jobs:
  - job: BuildJob
    steps:

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'

    - script: |
        python --version
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python -m compileall app
      displayName: Build application


# =========================
# TEST
# =========================
- stage: Test
  dependsOn: Build
  jobs:
  - job: TestJob
    steps:

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'

    - script: |
        echo "Current directory:"
        pwd

        echo "Directory contents:"
        ls -la

        echo "App directory:"
        ls -la app

        echo "Python:"
        python --version

        echo "Python import path:"
        python -c "import sys; print('\n'.join(sys.path))"

        echo "Testing app import:"
        python -c "import app; print(app)"
      displayName: Diagnose Python environment

    - script: |
        python --version
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      displayName: Install test dependencies

    - script: |
        pytest -v tests/calculator.py
      displayName: Run tests


# =========================
# DEPLOY
# =========================
- stage: Deploy
  dependsOn: Test
  jobs:
  - job: DeployJob
    steps:

    - script: |
        mkdir -p deployed-app
        cp app/calculator.py deployed-app/
        echo "Deployment completed"
      displayName: Deploy application

    - script: |
        echo "Running smoke test..."
        python -c "from app.calculator import add; assert add(2,3) == 5"
      displayName: Smoke test