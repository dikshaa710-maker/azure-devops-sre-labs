trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  pythonVersion: '3.12'

stages:
  - stage: Build
    displayName: Build
    jobs:
      - job: BuildJob
        displayName: Build Application
        steps:
          - checkout: self

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'

          - script: |
              python --version
              python -m pip install --upgrade pip
              pip install -r requirements.txt
            displayName: Install dependencies

          - script: |
              python -m compileall app
            displayName: Compile application

  - stage: Test
    displayName: Test
    dependsOn: Build
    jobs:
      - job: TestJob
        displayName: Run Tests
        steps:
          - checkout: self

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'

          - script: |
              python --version
              python -m pip install --upgrade pip

              echo "Testing access to private Azure Artifacts feed..."

              pip install pytest \
                --index-url "https://LAB_USER:INVALID_PASSWORD@YOUR_FEED_URL/simple/"
            displayName: Test pip authentication

          - script: |
              export PYTHONPATH="$(System.DefaultWorkingDirectory)"
              echo "PYTHONPATH=$PYTHONPATH"

              echo "Repository contents:"
              ls -la

              echo "App contents:"
              ls -la app

              echo "Tests contents:"
              ls -la tests

              echo "Testing app import:"
              python -c "import app; print('app imported successfully')"

              echo "Running unit tests:"
              pytest -v tests/calculator.py
            displayName: Run unit tests